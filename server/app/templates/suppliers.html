{% extends "base.html" %}{% block title %}الموردين{% endblock %}
{% block content %}
<h1>الموردين</h1>
<form method="post" action="/suppliers" class="card bar">
  <div style="flex:2;min-width:200px"><label>اسم المورد</label><input name="name" required></div>
  <div style="flex:1;min-width:150px"><label>التليفون</label><input name="phone" dir="ltr"></div>
  <button class="btn" style="align-self:end">+ إضافة مورد</button>
</form>
<div class="table-wrap"><table><tr><th class="num">م</th><th>المورد</th><th>التليفون</th><th>الحالة</th><th class="num">الرصيد المستحق</th><th>كشف الحساب</th><th></th></tr>
{% for s in items %}
<tr><td class="num">{{ loop.index }}</td><td><input name="name" value="{{ s.name }}" required form="s{{ s.id }}"></td><td><input name="phone" value="{{ s.phone or '' }}" dir="ltr" form="s{{ s.id }}"></td>
<td><select name="active" form="s{{ s.id }}"><option value="1" {{ 'selected' if s.active }}>فعّال</option><option value="0" {{ 'selected' if not s.active }}>موقوف</option></select></td>
<td class="num {{ 'neg' if balances[s.id] > 0 else '' }}">{{ balances[s.id]|money }}</td>
<td><a href="/suppliers/{{ s.id }}/statement">إجمالي</a> · <a href="/suppliers/{{ s.id }}/statement?view=detail">تفصيلي</a></td>
<td><form method="post" action="/suppliers" id="s{{ s.id }}"><input type="hidden" name="id" value="{{ s.id }}"><button class="btn small light">حفظ</button></form></td></tr>
{% else %}<tr><td colspan="7" class="muted">لا يوجد موردين بعد</td></tr>{% endfor %}
</table></div>
{% endblock %}
